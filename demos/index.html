<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lightfall</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: system-ui, sans-serif;
        color: #dddde3;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 14px;
        z-index: 10;
        font-size: 13px;
        user-select: none;
      }
      #label {
        margin-top: 6px;
        opacity: 0.75;
        max-width: 60ch;
      }
      label {
        cursor: pointer;
      }
      .slider {
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .slider span:first-child {
        width: 11ch;
        opacity: 0.85;
      }
      .slider input[type="range"] {
        width: 160px;
      }
      .slider .val {
        width: 5ch;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <label><input type="checkbox" id="redshift" /> redshift coloring</label>
      <div style="margin-top: 4px">
        <label><input type="checkbox" id="rays" /> traced rays</label>
      </div>
      <div class="slider">
        <span>geodesic length</span>
        <input type="range" id="length" min="4" max="28" step="0.5" value="12" />
        <span class="val" id="lengthVal">12</span>
      </div>
      <div class="slider">
        <span>observer dist</span>
        <input type="range" id="distance" min="2" max="12" step="0.25" value="5" />
        <span class="val" id="distanceVal">5</span>
      </div>
      <div class="slider">
        <span>ray budget</span>
        <input type="range" id="detail" min="0" max="100" step="1" value="22" />
        <span class="val" id="detailVal">—</span>
      </div>
      <div style="margin-top: 6px">
        <button id="refine">refine</button>
        <span id="status" style="opacity: 0.7"></span>
      </div>
      <div id="label"></div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
